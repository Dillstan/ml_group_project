<!DOCTYPE html>
<html>

<head>
    <title>Reel-ize Movie Finder</title>
</head>

<body>

    <h1>Reel-ize Movie Finder</h1>
    <label>
        <input type="checkbox" id="mockToggle" unchecked />
        Use Mock Data
    </label>
    <div id="drop-zone">
        <p>Drag & Drop Image or Video</p>
        <p>or Click to Upload</p>
        <p>No file chosen</p>
        <input type="file" id="fileInput" accept=".png,.jpg,.jpeg,.mp4,.mov" />
    </div>

    <button id="runBtn">Run Analysis</button>

    <div id="status">
        <p>Please upload a file!</p>
    </div>

    <div id="faces-container-wrapper">
        <h3>Choose a card to see prediction breakdowns!</h3>
        <div id="faces-scroll"></div>
    </div>
    <div id="face-detail"></div>

    <div id="media-container"></div>


    <script src="app.js"></script>

</body>

<style>
    body {
        background: #242424;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 0;
    }

    h1 {
        margin-top: 40px;
    }

    #fileInput {
        display: none;
    }

    #status {
        margin-top: 30px;
        padding: 20px;
        background: #1a1a1a;
        border-radius: 12px;
        width: fit-content;
        margin-left: auto;
        margin-right: auto;
        transition: all 0.3s ease;
    }

    #drop-zone {
        border: 2px dashed #6e6e6e;
        border-radius: 12px;
        padding: 40px;
        margin: 30px auto;
        width: 420px;
        background: #353535;
        cursor: pointer;
        transition: 0.2s;
    }

    #drop-zone:hover {
        background: #222;
        border-color: #ff4444;
    }

    #runBtn {
        background: #ff4444;
        border: none;
        padding: 10px 20px;
        color: white;
        cursor: pointer;
        border-radius: 6px;
        margin-top: 10px;
    }

    #runBtn:hover {
        background: #ff2222;
    }

    #runBtn:disabled {
        background: #555;
        cursor: not-allowed;
        opacity: 0.6;
        transform: none;
    }

    #faces-container-wrapper {
        display: none;
        width: fit-content;
        max-width: 75%;
        margin: 40px auto;
        background: #1a1a1a;
        border-radius: 15px;
        padding: 10px 10px 20px 10px;
        border: 1px solid #333;
    }

    #faces-container {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 30px;
        gap: 12px;
    }

    .face-card {
        min-width: 140px;
        background: #222;
        padding: 15px;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.2s;
        flex-shrink: 0;
        
        display: flex;
        flex-direction: column;
        align-items: center; 
        text-align: center;
    }

    .face-card:hover {
        transform: scale(1.03);
    }

    .face-card img {
        width: 100px !important;
        height: 100px !important;
        border-radius: 50% !important;
        object-fit: cover;
        display: block;
        margin: 0 auto 10px auto;
        border: 2px solid #444;
        overflow: hidden;
    }

    .face-card.selected {
        border: 2px solid #ff4444;
        transform: scale(1.05);
    }

    #media-container {
        display: none;
        margin: 0px auto;
        margin-top: 50px;
        margin-bottom: 150px;
        padding: 20px;
        justify-content: center;
        text-align: center;
        width: fit-content;
        background: #1a1a1a;
        border-radius: 10px;
        border: 1px solid #333;
    }

    #faces-scroll {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        text-align: center;
        justify-content: safe center;
        padding: 20px;
        white-space: nowrap;
    }

    #faces-scroll::after,
    #faces-scroll::before {
        content: '';
        margin: auto;
    }

    #faces-scroll::-webkit-scrollbar {
        height: 8px;
    }

    #faces-scroll::-webkit-scrollbar-track {
        background: #222;
        border-radius: 10px;
    }

    #faces-scroll::-webkit-scrollbar-thumb {
        background: #ff4444;
        border-radius: 10px;
    }

    #faces-scroll::-webkit-scrollbar-thumb:hover {
        background: #cc3333;
    }



    #face-detail {
        display: none;
        margin-top: 30px;
        padding: 50px;
        padding-left: 150px;
        padding-right: 150px;
        background: #1a1a1a;
        border-radius: 12px;
        width: fit-content;
        margin-left: auto;
        margin-right: auto;
        transition: all 0.3s ease;
    }
</style>

</html>
